<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3V Legal Notices — Native ES6 Demo</title>
  <link rel="stylesheet" href="d3v-legal.css">
  <script type="module" src="d3v-legal.js"></script>
</head>
<body>
  <main class="container">
    <h1>D3V Legal Notices</h1>

    <article
      data-d3v-legal
      data-notice="cookies"
      data-company="Example Co"
    ></article>

    <article
      data-d3v-legal
      data-notice="privacy"
      data-company="Example Co"
      data-email="info@example.co.za"
      data-address="21 Random Street, Somewhere, South Africa"
      data-tel="+27 82 000 0000"
    ></article>

    <article
      data-d3v-legal
      data-notice="returns"
      data-company="Example Co"
      data-returnwindow="30"
    ></article>
  </main>
</body>
</html>
